openapi: 3.0.0
info:
  title: Asset API
  version: 1.1.0
  description: |
    Web API for the asset dashboard, backed by Google Apps Script.
    It serves portfolio data assembled from Drive files (CSVs and the
    monthly money files), plus session and share-link management.

    Every request requires authentication: a verified Google ID token
    (`id_token`), an owner session token, or a share token. There is no
    unauthenticated mode.

    The main data read returns the full payload; `scope=activity` is
    not supported here (that is health-gas). The family configuration
    (birth dates, owner rules, funds) is NOT in this repository: it
    lives in the `FAMILY_CONFIG_JSON` script property and is served
    only to authenticated callers via `action=family_config`.
servers:
  - url: https://script.google.com/macros/s/<deployment-id>/exec
    description: Google Apps Script web app deployment (replace with the actual deployment URL)
paths:
  /exec:
    get:
      summary: Asset data and account actions
      operationId: assetGet
      parameters:
        - name: f
          in: query
          schema:
            type: string
            enum: [preCacheAll]
          description: Cache warm-up function to execute
        - name: action
          in: query
          schema:
            type: string
            enum: [dashboard_rss, warm_cache, exchange_session, revoke_session, issue_share, revoke_share, family_config]
          description: Account/data action to perform
        - name: id_token
          in: query
          schema:
            type: string
          description: Google ID Token for authentication
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          description: Missing or invalid credential
